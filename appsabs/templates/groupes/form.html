{% extends 'base.html' %}
{% block title %}Groupe{% endblock %}

{% block content %}
<h2>{% if form.instance.pk %}Modifier{% else %}Ajouter{% endif %} un Groupe</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'groupe-liste' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
