{% extends 'base.html' %}

{% block content %}

<h1>Ajouter un étudiant</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Enregistrer
    </button>

    <a href="/etudiants/" class="btn btn-secondary">
        Annuler
    </a>
</form>

{% endblock %}
