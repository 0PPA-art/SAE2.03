{% extends 'base.html' %}

{% block content %}

<h1>Ajouter un enseignant</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Enregistrer
    </button>

    <a href="/enseignants/" class="btn btn-secondary">
        Annuler
    </a>
</form>

{% endblock %}
